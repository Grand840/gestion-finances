name: Sillage validation
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest tests/test_family.py -q
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:ui
        env:
          PYTHON: python
      - run: python scripts/configure.py
      - run: docker compose config --quiet
      - run: docker compose up -d --build --wait db app
      - run: curl --fail http://localhost:8080/api/health
      - if: always()
        run: docker compose down
