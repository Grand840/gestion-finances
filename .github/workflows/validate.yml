name: Sillage validation
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: npm
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest -q
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:ui
        env:
          PYTHON: python
      - run: python scripts/configure.py
      - run: docker compose config --quiet
      - run: docker compose up -d --build --wait db app
      - run: curl --fail http://localhost:8080/api/health
      - run: python tests/docker-smoke.py
        env:
          SILLAGE_CI_SMOKE: "1"
      - name: Tester sauvegarde et restauration Docker
        run: |
          ./scripts/backup.sh
          printf 'RESTAURER\n' | ./scripts/restore.sh "$(find backups -name '*.dump' -print -quit)"
          docker compose up -d --wait db app
          python tests/docker-smoke.py --verify
        env:
          SILLAGE_CI_SMOKE: "1"
      - if: always()
        run: |
          if [ -f .env ]; then docker compose down; fi
